spring:
  config:
    import: optional:classpath:secrets.yaml

  datasource:
    url: jdbc:postgresql://localhost:5432/pp_task_1
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  thymeleaf:
    cache: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080