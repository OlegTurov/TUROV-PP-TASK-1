<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Посты</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
        }

        .logout-button {
            padding: 8px 16px;
            cursor: pointer;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .create-post {
            width: 35%;
            height: fit-content;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .posts {
            width: 65%;
        }

        .post {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .post-email {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .post-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 10px;
            resize: vertical;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>Посты</h1>
    <div th:text="${user.email}"></div>

    <form th:action="@{/logout}" method="post">
        <button
                type="submit"
                class="logout-button">
            Выйти
        </button>
    </form>
</header>

<div class="container">

    <div class="create-post">
        <h2>Создать пост</h2>

        <form th:action="@{/posts}" method="post">
            <textarea
                    name="text"
                    placeholder="Введите текст поста"
                    required></textarea>

            <button type="submit">
                Опубликовать
            </button>
        </form>
    </div>

    <div class="posts">
        <div
                class="post"
                th:each="post : ${posts}">

            <div
                    class="post-email"
                    th:text="${post.email}">
                user@example.com
            </div>

            <div
                    class="post-text"
                    th:text="${post.text}">
                Текст поста
            </div>

        </div>
    </div>

</div>

</body>
</html>
